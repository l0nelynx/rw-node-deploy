---
dependency:
  name: galaxy
  options:
    role-file: requirements.yml
    requirements-file: requirements.yml
driver:
  name: docker
platforms:
  - name: "warp-${MOLECULE_DISTRO:-debian12}"
    image: "${MOLECULE_IMAGE:-debian:12}"
    pre_build_image: false
    privileged: true
    command: /sbin/init
    tty: true
    cgroupns_mode: host
    groups: [webservers]
    env:
      container: docker
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs: [/run, /run/lock]
provisioner:
  name: ansible
  inventory:
    group_vars:
      all:
        ansible_user: root
        main_domain: example.test
        sub_mask: warp
        sub_count: 1
        pp_map: [0]
        panel_control_port: 2222
        install_warp: true
        warp_watchdog: 1
        warp_watchdog_enabled: true
verifier:
  name: ansible
scenario:
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - side_effect
    - verify
    - cleanup
    - destroy
