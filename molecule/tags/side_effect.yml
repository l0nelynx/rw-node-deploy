---
- name: Exercise public tag behavior
  hosts: all
  become: true
  vars:
    project_dir: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}"
    molecule_inventory: "{{ lookup('env', 'MOLECULE_INVENTORY_FILE') }}"
  tasks:
    - name: Require generated Molecule inventory path
      ansible.builtin.assert:
        that: molecule_inventory | length > 0

    - name: Capture nginx identity before config-only run
      ansible.builtin.command:
        argv: [docker, inspect, -f, "{% raw %}{{.Id}} {{.State.StartedAt}}{% endraw %}", nginx]
      register: nginx_before_config
      changed_when: false

    - name: Remove generated nginx configuration before standalone config tag
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /opt/nginx/conf.d
        - /opt/nginx/nginx.conf

    - name: Run config tag through actual role entrypoint
      ansible.builtin.command:
        argv:
          - ansible-playbook
          - -i
          - "{{ molecule_inventory }}"
          - tests/playbooks/tag_target.yml
          - --tags
          - config
      args:
        chdir: "{{ project_dir }}"
      delegate_to: localhost
      become: false
      changed_when: false

    - name: Capture nginx identity after config-only run
      ansible.builtin.command:
        argv: [docker, inspect, -f, "{% raw %}{{.Id}} {{.State.StartedAt}}{% endraw %}", nginx]
      register: nginx_after_config
      changed_when: false

    - name: Require config tag not to restart nginx
      ansible.builtin.assert:
        that:
          - nginx_before_config.stdout == nginx_after_config.stdout

    - name: Verify standalone config tag recreated configuration
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /opt/nginx/conf.d/default.conf
        - /opt/nginx/nginx.conf
      register: standalone_config_files

    - name: Require standalone config files
      ansible.builtin.assert:
        that: item.stat.exists
      loop: "{{ standalone_config_files.results }}"

    - name: Run unchanged nginx tag through actual role entrypoint
      ansible.builtin.command:
        argv: [ansible-playbook, -i, "{{ molecule_inventory }}", tests/playbooks/tag_target.yml, --tags, nginx]
      args:
        chdir: "{{ project_dir }}"
      delegate_to: localhost
      become: false
      changed_when: false

    - name: Capture nginx identity after unchanged nginx tag
      ansible.builtin.command:
        argv: [docker, inspect, -f, "{% raw %}{{.Id}} {{.State.StartedAt}}{% endraw %}", nginx]
      register: nginx_after_unchanged_tag
      changed_when: false

    - name: Require unchanged nginx tag not to recreate container
      ansible.builtin.assert:
        that: nginx_after_config.stdout == nginx_after_unchanged_tag.stdout

    - name: Run nginx tag with changed derived configuration
      ansible.builtin.command:
        argv:
          - ansible-playbook
          - -i
          - "{{ molecule_inventory }}"
          - tests/playbooks/tag_target.yml
          - --tags
          - nginx
          - -e
          - '{"sub_count":3,"pp_map":[1,0,0]}'
      args:
        chdir: "{{ project_dir }}"
      delegate_to: localhost
      become: false
      changed_when: false

    - name: Capture nginx identity after changed nginx tag
      ansible.builtin.command:
        argv: [docker, inspect, -f, "{% raw %}{{.Id}} {{.State.StartedAt}}{% endraw %}", nginx]
      register: nginx_after_changed_tag
      changed_when: false

    - name: Require changed nginx config to recreate container
      ansible.builtin.assert:
        that: nginx_after_unchanged_tag.stdout != nginx_after_changed_tag.stdout

    - name: Capture fake-site timestamp before repo-only run
      ansible.builtin.stat:
        path: /opt/nginx/html/index.html
      register: site_before_repo

    - name: Run repo tag through actual role entrypoint
      ansible.builtin.command:
        argv: [ansible-playbook, -i, "{{ molecule_inventory }}", tests/playbooks/tag_target.yml, --tags, repo]
      args:
        chdir: "{{ project_dir }}"
      delegate_to: localhost
      become: false
      changed_when: false

    - name: Read fake-site timestamp after stable repo run
      ansible.builtin.stat:
        path: /opt/nginx/html/index.html
      register: site_after_repo

    - name: Require stable fake-site without forced regeneration
      ansible.builtin.assert:
        that: site_before_repo.stat.mtime == site_after_repo.stat.mtime

    - name: Run DNS tag twice
      ansible.builtin.command:
        argv: [ansible-playbook, -i, "{{ molecule_inventory }}", tests/playbooks/tag_target.yml, --tags, dns]
      args:
        chdir: "{{ project_dir }}"
      delegate_to: localhost
      become: false
      loop: [first, second]
      changed_when: false

    - name: Read state after repeated DNS tag
      ansible.builtin.uri:
        url: http://127.0.0.1:8080/admin/state
        return_content: true
      register: dns_state
      changed_when: false

    - name: Require repeated DNS tag not to duplicate records
      ansible.builtin.assert:
        that: dns_state.json.dns_records | length == 3

    - name: Capture Remnanode identity before port update
      ansible.builtin.command:
        argv: [docker, inspect, -f, "{% raw %}{{.Id}}{% endraw %}", remnanode]
      register: remnanode_before_port
      changed_when: false

    - name: Update Remnanode through public tag
      ansible.builtin.command:
        argv:
          - ansible-playbook
          - -i
          - "{{ molecule_inventory }}"
          - tests/playbooks/tag_target.yml
          - --tags
          - remnanode
          - -e
          - panel_control_port=2333
      args:
        chdir: "{{ project_dir }}"
      delegate_to: localhost
      become: false
      changed_when: false

    - name: Capture Remnanode identity after port update
      ansible.builtin.command:
        argv: [docker, inspect, -f, "{% raw %}{{.Id}}{% endraw %}", remnanode]
      register: remnanode_after_port
      changed_when: false

    - name: Verify Remnanode was recreated for the port change
      ansible.builtin.assert:
        that: remnanode_before_port.stdout != remnanode_after_port.stdout

    - name: Record fake-site checksum before source revision change
      ansible.builtin.stat:
        path: /opt/nginx/html/index.html
        checksum_algorithm: sha256
      register: site_before_source_change

    - name: Change fake-site template source
      ansible.builtin.copy:
        dest: /opt/rw-test/template-repo/esports-stream-template/index.html
        mode: '0644'
        content: "<html><body>changed fixture revision</body></html>\n"

    - name: Stage changed fake-site source
      ansible.builtin.command:
        argv: [git, add, esports-stream-template/index.html]
      args:
        chdir: /opt/rw-test/template-repo
      changed_when: true

    - name: Commit changed fake-site source
      ansible.builtin.command:
        argv: [git, commit, -m, changed-template-fixture]
      args:
        chdir: /opt/rw-test/template-repo
      changed_when: true

    - name: Reconcile changed fake-site source revision
      ansible.builtin.command:
        argv: [ansible-playbook, -i, "{{ molecule_inventory }}", tests/playbooks/tag_target.yml, --tags, repo]
      args:
        chdir: "{{ project_dir }}"
      delegate_to: localhost
      become: false
      changed_when: false

    - name: Read fake-site checksum after source revision change
      ansible.builtin.stat:
        path: /opt/nginx/html/index.html
        checksum_algorithm: sha256
      register: site_after_source_change

    - name: Require source revision change to regenerate fake site
      ansible.builtin.assert:
        that: site_before_source_change.stat.checksum != site_after_source_change.stat.checksum

    - name: Capture fake-site timestamp before forced regeneration
      ansible.builtin.stat:
        path: /opt/nginx/html/index.html
      register: site_before_force

    - name: Ensure distinguishable fake-site timestamp
      ansible.builtin.pause:
        seconds: 1

    - name: Force fake-site regeneration through repo tag
      ansible.builtin.command:
        argv:
          - ansible-playbook
          - -i
          - "{{ molecule_inventory }}"
          - tests/playbooks/tag_target.yml
          - --tags
          - repo
          - -e
          - '{"fake_site_force_regenerate":true}'
      args:
        chdir: "{{ project_dir }}"
      delegate_to: localhost
      become: false
      changed_when: false

    - name: Capture fake-site timestamp after forced regeneration
      ansible.builtin.stat:
        path: /opt/nginx/html/index.html
      register: site_after_force

    - name: Require forced fake-site regeneration
      ansible.builtin.assert:
        that: site_after_force.stat.mtime > site_before_force.stat.mtime

    - name: Record healthy fake-site checksum
      ansible.builtin.stat:
        path: /opt/nginx/html/index.html
        checksum_algorithm: sha256
      register: healthy_site

    - name: Install zero-archive generator fixture
      ansible.builtin.copy:
        dest: /opt/rw-test/template-repo/uniquify-theme.sh
        mode: '0755'
        content: |
          #!/bin/sh
          exit 0

    - name: Stage broken zero-archive fixture
      ansible.builtin.command:
        argv: [git, add, uniquify-theme.sh]
      args:
        chdir: /opt/rw-test/template-repo
      changed_when: true

    - name: Commit broken zero-archive fixture
      ansible.builtin.command:
        argv: [git, commit, -m, zero-archive-fixture]
      args:
        chdir: /opt/rw-test/template-repo
      changed_when: true

    - name: Require zero-archive generator failure
      ansible.builtin.command:
        argv: [ansible-playbook, -i, "{{ molecule_inventory }}", tests/playbooks/tag_target.yml, --tags, repo]
      args:
        chdir: "{{ project_dir }}"
      delegate_to: localhost
      become: false
      register: zero_archive_result
      changed_when: false
      failed_when: zero_archive_result.rc == 0

    - name: Verify previous fake site survived zero-archive failure
      ansible.builtin.stat:
        path: /opt/nginx/html/index.html
        checksum_algorithm: sha256
      register: site_after_zero_archive

    - name: Require atomic rollback after zero-archive failure
      ansible.builtin.assert:
        that: site_after_zero_archive.stat.checksum == healthy_site.stat.checksum

    - name: Install multiple-archive generator fixture
      ansible.builtin.copy:
        dest: /opt/rw-test/template-repo/uniquify-theme.sh
        mode: '0755'
        content: |
          #!/bin/sh
          set -eu
          python3 -c 'import zipfile; [zipfile.ZipFile(name, "w").close() for name in ("one.zip", "two.zip")]'

    - name: Stage broken multiple-archive fixture
      ansible.builtin.command:
        argv: [git, add, uniquify-theme.sh]
      args:
        chdir: /opt/rw-test/template-repo
      changed_when: true

    - name: Commit broken multiple-archive fixture
      ansible.builtin.command:
        argv: [git, commit, -m, multiple-archive-fixture]
      args:
        chdir: /opt/rw-test/template-repo
      changed_when: true

    - name: Require multiple-archive generator failure
      ansible.builtin.command:
        argv: [ansible-playbook, -i, "{{ molecule_inventory }}", tests/playbooks/tag_target.yml, --tags, repo]
      args:
        chdir: "{{ project_dir }}"
      delegate_to: localhost
      become: false
      register: multiple_archive_result
      changed_when: false
      failed_when: multiple_archive_result.rc == 0

    - name: Verify previous fake site survived multiple-archive failure
      ansible.builtin.stat:
        path: /opt/nginx/html/index.html
        checksum_algorithm: sha256
      register: site_after_multiple_archives

    - name: Require atomic rollback after multiple-archive failure
      ansible.builtin.assert:
        that: site_after_multiple_archives.stat.checksum == healthy_site.stat.checksum

    - name: Install invalid-site archive generator fixture
      ansible.builtin.copy:
        dest: /opt/rw-test/template-repo/uniquify-theme.sh
        mode: '0755'
        content: |
          #!/bin/sh
          set -eu
          printf 'missing index\n' > wrong.txt
          python3 -c 'import zipfile; z=zipfile.ZipFile("invalid-site.zip", "w"); z.write("wrong.txt"); z.close()'

    - name: Stage invalid-site archive fixture
      ansible.builtin.command:
        argv: [git, add, uniquify-theme.sh]
      args:
        chdir: /opt/rw-test/template-repo
      changed_when: true

    - name: Commit invalid-site archive fixture
      ansible.builtin.command:
        argv: [git, commit, -m, invalid-site-fixture]
      args:
        chdir: /opt/rw-test/template-repo
      changed_when: true

    - name: Require missing-index archive failure
      ansible.builtin.command:
        argv: [ansible-playbook, -i, "{{ molecule_inventory }}", tests/playbooks/tag_target.yml, --tags, repo]
      args:
        chdir: "{{ project_dir }}"
      delegate_to: localhost
      become: false
      register: invalid_site_result
      changed_when: false
      failed_when: invalid_site_result.rc == 0

    - name: Verify previous fake site survived invalid replacement
      ansible.builtin.stat:
        path: /opt/nginx/html/index.html
        checksum_algorithm: sha256
      register: site_after_invalid_archive

    - name: Require rollback after invalid-site replacement
      ansible.builtin.assert:
        that: site_after_invalid_archive.stat.checksum == healthy_site.stat.checksum

    - name: List config tag tasks
      ansible.builtin.command:
        argv: [ansible-playbook, -i, "{{ molecule_inventory }}", tests/playbooks/tag_target.yml, --list-tasks, --tags, config]
      args:
        chdir: "{{ project_dir }}"
      delegate_to: localhost
      become: false
      register: config_task_list
      changed_when: false

    - name: Verify static config tag contract
      ansible.builtin.assert:
        that:
          - "'Generate default nginx server configuration' in config_task_list.stdout"
          - "'Pull and reconcile nginx containers' not in config_task_list.stdout"
