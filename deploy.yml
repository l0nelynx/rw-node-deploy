---
# Play 1: Bootstrap — установить сервисный ключ на новые хосты
- name: Bootstrap SSH service key
  hosts: webservers
  gather_facts: false
  vars:
    service_key_path: "~/.ssh/id_ed25519"
    # Если root_pass задан — подключаемся по паролю, иначе по мастер-ключу {{master_key}}
    ansible_password: "{{ root_pass | default(omit) }}"
    ansible_ssh_private_key_file: >-
      {{
        (root_pass is defined) | ternary(
          omit,
          (master_key | expanduser) if (master_key.startswith('/') or master_key.startswith('~'))
          else (playbook_dir + '/' + master_key)
        )
      }}
    # Отключаем проверку ключей для bootstrap-этапа (особенно важно при использовании пароля)
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
  tasks:
    - import_role:
        name: deploy-rw-by-lynx
        tasks_from: install_keys.yml

# Play 2: WARP — устанавливается только на хостах с install_warp=true
- name: Install WARP
  hosts: webservers
  become: true
  tags: [warp]
  vars:
    ansible_ssh_private_key_file: "~/.ssh/id_ed25519"
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o GlobalKnownHostsFile=/dev/null -o BatchMode=yes -o ServerAliveInterval=15 -o ServerAliveCountMax=6'
  roles:
    - role: warp_native
      when: install_warp | default(false) | bool
  tasks:
    # Исправить endpoint на IPv4 если IPv6 недоступен (роль это не делает)
    - name: Fix WARP endpoint if IPv6 is unavailable
      when: install_warp | default(false) | bool
      shell: |
        CONF=/etc/wireguard/warp.conf
        if ping6 -c1 -W3 2606:4700:4700::1111 >/dev/null 2>&1; then
          echo "ipv6_ok: keeping default endpoint"
        else
          IPV4=$(python3 -c "import socket; print(socket.getaddrinfo('engage.cloudflareclient.com',2408,socket.AF_INET)[0][4][0])" 2>/dev/null)
          if [ -n "$IPV4" ]; then
            sed -i "s|Endpoint = .*:2408|Endpoint = ${IPV4}:2408|" "$CONF"
            systemctl restart wg-quick@warp
            echo "ipv6_broken: forced endpoint ${IPV4}, restarted"
          fi
        fi
      args:
        executable: /bin/bash
      register: warp_endpoint_fix

    - name: Show endpoint decision
      when: install_warp | default(false) | bool
      debug:
        msg: "{{ warp_endpoint_fix.stdout }}"

    # WARP+ — пробуем per-host ключ (warp_plus), затем общий пул warp_plus.json.
    # Вся логика вынесена в роль, чтобы переиспользовать переменные и шаблоны.
    - name: Apply WARP+ from key pool
      include_role:
        name: deploy-rw-by-lynx
        tasks_from: warp_plus
      when: install_warp | default(false) | bool

    # Watchdog: перезапускает интерфейс warp при устаревшем handshake.
    - name: Setup WARP watchdog
      include_role:
        name: deploy-rw-by-lynx
        tasks_from: warp_watchdog
      when: install_warp | default(false) | bool

# Play 3: Основной деплой — всегда по сервисному ключу
- name: Deploy Remnawave Node
  hosts: webservers
  become: true
  vars:
    ansible_ssh_private_key_file: "~/.ssh/id_ed25519"
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o GlobalKnownHostsFile=/dev/null -o BatchMode=yes -o ServerAliveInterval=15 -o ServerAliveCountMax=6'
#  vars_prompt:
#    - name: cf_token
#      prompt: "Cloudflare API Token"
#      private: true
#
#    - name: cf_zone_id
#      prompt: "Cloudflare Zone ID"
#      private: false
#
#    - name: rw_token
#      prompt: "Enter RW SECRET_TOKEN"
#      private: true
  roles:
    - deploy-rw-by-lynx
