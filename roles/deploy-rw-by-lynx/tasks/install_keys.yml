- name: Validate bootstrap credentials
  ansible.builtin.assert:
    that:
      - (root_pass | default('', true) | length > 0) or (master_key | default('', true) | length > 0)
    fail_msg: Set root_pass or master_key before bootstrapping a host.
  delegate_to: localhost
  become: false
  run_once: true
  no_log: true

- name: Generate dedicated service SSH key locally
  delegate_to: localhost
  become: false
  run_once: true
  ansible.builtin.command:
    argv:
      - ssh-keygen
      - -t
      - ed25519
      - -f
      - "{{ service_key_path | expanduser }}"
      - -N
      - ''
      - -C
      - ansible-service-key
  args:
    creates: "{{ service_key_path | expanduser }}"

- name: Verify service key pair exists
  ansible.builtin.stat:
    path: "{{ item }}"
  delegate_to: localhost
  become: false
  run_once: true
  loop:
    - "{{ service_key_path | expanduser }}"
    - "{{ service_key_path | expanduser }}.pub"
  register: service_key_files

- name: Require service key pair
  ansible.builtin.assert:
    that: service_key_files.results | map(attribute='stat.exists') | list | min
    fail_msg: "Service key pair is incomplete at {{ service_key_path | expanduser }}."
  delegate_to: localhost
  become: false
  run_once: true

- name: Install service public key on remote host
  ansible.posix.authorized_key:
    user: root
    state: present
    key: "{{ lookup('ansible.builtin.file', (service_key_path | expanduser) + '.pub') }}"
