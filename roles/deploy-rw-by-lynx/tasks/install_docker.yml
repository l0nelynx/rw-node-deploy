---
- name: Install Docker prerequisites on Debian-family hosts
  ansible.builtin.apt:
    name: [ca-certificates, curl, gnupg, python3-debian]
    state: present
    update_cache: true
    cache_valid_time: 3600
    lock_timeout: 300
  when: ansible_facts.os_family == 'Debian'

- name: Create Docker apt keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'
  when: ansible_facts.os_family == 'Debian'

- name: Install Docker apt signing key
  ansible.builtin.get_url:
    url: "https://download.docker.com/linux/{{ ansible_facts.distribution | lower }}/gpg"
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'
  when: ansible_facts.os_family == 'Debian'

- name: Configure Docker deb822 repository
  ansible.builtin.deb822_repository:
    name: docker
    types: [deb]
    uris: "https://download.docker.com/linux/{{ ansible_facts.distribution | lower }}"
    suites: "{{ ansible_facts.distribution_release }}"
    components: [stable]
    architectures: ["{{ 'amd64' if ansible_facts.architecture == 'x86_64' else 'arm64' }}"]
    signed_by: /etc/apt/keyrings/docker.asc
    state: present
  register: docker_apt_repository
  when: ansible_facts.os_family == 'Debian'

- name: Refresh apt cache after Docker repository changes
  ansible.builtin.apt:
    update_cache: true
    lock_timeout: 300
  when:
    - ansible_facts.os_family == 'Debian'
    - docker_apt_repository.changed

- name: Install Docker repository support on RedHat-family hosts
  ansible.builtin.dnf:
    name: dnf-plugins-core
    state: present
  when: ansible_facts.os_family == 'RedHat'

- name: Configure Docker dnf repository
  ansible.builtin.yum_repository:
    name: docker-ce-stable
    description: Docker CE Stable
    baseurl: https://download.docker.com/linux/rhel/$releasever/$basearch/stable
    gpgcheck: true
    gpgkey: https://download.docker.com/linux/rhel/gpg
    enabled: true
  when: ansible_facts.os_family == 'RedHat'

- name: Install Docker Engine and Compose plugin
  ansible.builtin.package:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present

- name: Start and enable Docker
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Add non-root SSH user to docker group
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups: docker
    append: true
  when: ansible_user != 'root'

- name: Verify Docker Compose v2 is available
  ansible.builtin.command:
    argv: [docker, compose, version]
  changed_when: false
