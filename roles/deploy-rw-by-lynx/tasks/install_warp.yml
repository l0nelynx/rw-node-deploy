# ── WARP via wgcf ─────────────────────────────────────────────
- name: Setup WARP
  when: install_warp | default(false) | bool
  block:
    - name: Install WireGuard
      package:
        name: wireguard
        state: present

    - name: Get latest wgcf release version
      uri:
        url: https://api.github.com/repos/ViRb3/wgcf/releases/latest
        return_content: true
      register: wgcf_release

    - name: Set wgcf arch and version facts
      set_fact:
        wgcf_version: "{{ wgcf_release.json.tag_name | regex_replace('^v', '') }}"
        wgcf_arch: "{{ {'x86_64': 'amd64', 'aarch64': 'arm64', 'armv7l': 'armv7'}.get(ansible_architecture, 'amd64') }}"

    - name: Check if wgcf is already installed
      stat:
        path: /usr/local/bin/wgcf
      register: wgcf_bin

    - name: Download wgcf binary
      get_url:
        url: "https://github.com/ViRb3/wgcf/releases/download/v{{ wgcf_version }}/wgcf_{{ wgcf_version }}_linux_{{ wgcf_arch }}"
        dest: /usr/local/bin/wgcf
        mode: '0755'
      when: not wgcf_bin.stat.exists

    - name: Check if warp.conf already exists (skip reinstall)
      stat:
        path: /etc/wireguard/warp.conf
      register: warp_conf

    - name: Configure WARP
      when: not warp_conf.stat.exists
      block:
        - name: Register with Cloudflare WARP (auto-accept ToS)
          shell: |
            cd /root
            timeout 60 bash -c 'yes | wgcf register' || true
          args:
            executable: /bin/bash

        - name: Verify registration succeeded
          stat:
            path: /root/wgcf-account.toml
          register: account_file
          failed_when: not account_file.stat.exists

        - name: Generate initial wgcf config
          shell: cd /root && wgcf generate
          args:
            executable: /bin/bash

        - name: Apply WARP+ license key
          shell: wgcf update --license-key "{{ warp_plus }}"
          when: warp_plus is defined and warp_plus | length > 0

        - name: Regenerate config with WARP+ profile
          shell: cd /root && wgcf generate
          args:
            executable: /bin/bash
          when: warp_plus is defined and warp_plus | length > 0

        - name: Edit wgcf config (remove DNS, add Table=off and Keepalive)
          shell: |
            cd /root
            sed -i '/^DNS =/d' wgcf-profile.conf
            grep -q "Table = off" wgcf-profile.conf \
              || sed -i '/^MTU =/a Table = off' wgcf-profile.conf
            grep -q "PersistentKeepalive" wgcf-profile.conf \
              || sed -i '/^Endpoint =/a PersistentKeepalive = 25' wgcf-profile.conf
          args:
            executable: /bin/bash

        - name: Remove IPv6 address from WARP interface
          shell: |
            sed -i 's/,\s*[0-9a-fA-F:]\+\/128//' /root/wgcf-profile.conf
            sed -i '/^Address = [0-9a-fA-F:]\+\/128/d' /root/wgcf-profile.conf
          args:
            executable: /bin/bash

        # If IPv6 is broken or disabled — hardcode IPv4 endpoint.
        # If IPv6 works — leave the hostname so wgcf can use IPv6 natively.
        - name: Fix WARP endpoint if IPv6 is unavailable
          shell: |
            if ping6 -c1 -W3 2606:4700:4700::1111 >/dev/null 2>&1; then
              echo "ipv6_ok: keeping default endpoint"
            else
              IPV4=$(python3 -c "
import socket
r = socket.getaddrinfo('engage.cloudflareclient.com', 2408, socket.AF_INET)
print(r[0][4][0])
" 2>/dev/null)
              if [ -n "$IPV4" ]; then
                sed -i "s|Endpoint = .*:2408|Endpoint = ${IPV4}:2408|" /root/wgcf-profile.conf
                echo "ipv6_broken: forced IPv4 endpoint ${IPV4}"
              fi
            fi
          args:
            executable: /bin/bash
          register: warp_endpoint_result

        - name: Show endpoint decision
          debug:
            msg: "{{ warp_endpoint_result.stdout }}"

        - name: Ensure /etc/wireguard exists
          file:
            path: /etc/wireguard
            state: directory
            mode: '0700'

        - name: Move wgcf-profile.conf to /etc/wireguard/warp.conf
          command: mv /root/wgcf-profile.conf /etc/wireguard/warp.conf

    - name: Start and enable wg-quick@warp
      service:
        name: wg-quick@warp
        state: started
        enabled: true

    # ── Watchdog ─────────────────────────────────────────────────
    - name: Create watchdog directory
      file:
        path: /opt/warp-native/logs
        state: directory
        mode: '0755'

    - name: Deploy watchdog config
      copy:
        dest: /opt/warp-native/config.env
        mode: '0644'
        force: false
        content: |
          HANDSHAKE_THRESHOLD=180
          RESTART_COOLDOWN=120
          LOG_MAX_LINES=1000

    - name: Deploy watchdog script
      copy:
        dest: /opt/warp-native/warp-watchdog.sh
        mode: '0755'
        content: |
          #!/bin/bash
          CONFIG="/opt/warp-native/config.env"
          LOG="/opt/warp-native/logs/watchdog.log"
          COOLDOWN_FILE="/opt/warp-native/logs/.last_restart"
          [[ -f "$CONFIG" ]] && source "$CONFIG"
          HANDSHAKE_THRESHOLD="${HANDSHAKE_THRESHOLD:-180}"
          RESTART_COOLDOWN="${RESTART_COOLDOWN:-120}"
          LOG_MAX_LINES="${LOG_MAX_LINES:-1000}"
          log() { echo "[$(date '+%Y-%m-%d %H:%M:%S')] [$1] $2" >> "$LOG"; }
          hs=$(wg show warp latest-handshakes 2>/dev/null | awk '{print $2}')
          if [[ -z "$hs" || "$hs" -eq 0 ]]; then
            log "WARN" "No handshake, restarting warp"
            systemctl restart wg-quick@warp
            exit 0
          fi
          age=$(( $(date +%s) - hs ))
          if [[ $age -gt $HANDSHAKE_THRESHOLD ]]; then
            if [[ -f "$COOLDOWN_FILE" ]]; then
              last=$(cat "$COOLDOWN_FILE"); now=$(date +%s)
              (( now - last < RESTART_COOLDOWN )) && { log "INFO" "Cooldown active, skip"; exit 0; }
            fi
            date +%s > "$COOLDOWN_FILE"
            systemctl restart wg-quick@warp
            log "WARN" "Restarted — handshake was ${age}s stale"
          else
            log "OK" "Handshake ${age}s ago"
          fi
          lines=$(wc -l < "$LOG" 2>/dev/null || echo 0)
          (( lines > LOG_MAX_LINES )) && tail -n "$LOG_MAX_LINES" "$LOG" > "${LOG}.tmp" && mv "${LOG}.tmp" "$LOG"

    - name: Setup watchdog cron (every 10 min)
      copy:
        dest: /etc/cron.d/warp-native
        mode: '0644'
        content: "*/10 * * * * root /opt/warp-native/warp-watchdog.sh\n"
