---
- name: Install nftables
  ansible.builtin.package:
    name: nftables
    state: present

- name: Stop and disable UFW when installed
  block:
    - name: Collect service facts
      ansible.builtin.service_facts:

    - name: Stop and disable UFW
      ansible.builtin.systemd:
        name: ufw.service
        state: stopped
        enabled: false
      when: "'ufw.service' in ansible_facts.services"

- name: Ensure firewall cache directory exists
  ansible.builtin.file:
    path: /var/lib/rw-node-firewall
    state: directory
    mode: '0700'

- name: Check for controller-side whitelist
  ansible.builtin.stat:
    path: "{{ firewall_whitelist_path }}"
  delegate_to: localhost
  become: false
  register: firewall_whitelist_stat

- name: Copy controller whitelist when present
  ansible.builtin.copy:
    src: "{{ firewall_whitelist_path }}"
    dest: /var/lib/rw-node-firewall/whitelist.nft.download
    mode: '0600'
  when: firewall_whitelist_stat.stat.exists

- name: Remove cached whitelist when controller whitelist is absent
  ansible.builtin.file:
    path: /var/lib/rw-node-firewall/whitelist.nft.download
    state: absent
  when: not firewall_whitelist_stat.stat.exists

- name: Download candidate IPv4 ASN blacklist
  ansible.builtin.get_url:
    url: "{{ firewall_blacklist_urls.v4 }}"
    dest: /var/lib/rw-node-firewall/blacklist-v4.nft.download
    mode: '0600'
    force: true
    timeout: 30

- name: Download candidate IPv6 ASN blacklist
  ansible.builtin.get_url:
    url: "{{ firewall_blacklist_urls.v6 }}"
    dest: /var/lib/rw-node-firewall/blacklist-v6.nft.download
    mode: '0600'
    force: true
    timeout: 30

- name: Normalize panel control source addresses
  ansible.builtin.set_fact:
    firewall_panel_sources: >-
      {{ panel_control_ip if (panel_control_ip is defined and panel_control_ip is sequence and panel_control_ip is not string)
         else ([panel_control_ip] if panel_control_ip is defined and panel_control_ip | length > 0 else []) }}

- name: Validate panel control source addresses
  ansible.builtin.assert:
    that: >-
      item is match('^([0-9]{1,3}\\.){3}[0-9]{1,3}$')
      or item is match('^[0-9A-Fa-f:]+$')
    fail_msg: panel_control_ip contains an invalid IP address.
  loop: "{{ firewall_panel_sources }}"

- name: Split panel control source addresses by address family
  ansible.builtin.set_fact:
    firewall_panel_ipv4: "{{ firewall_panel_sources | select('match', '^([0-9]{1,3}\\.){3}[0-9]{1,3}$') | list }}"
    firewall_panel_ipv6: "{{ firewall_panel_sources | select('search', ':') | list }}"

- name: Detect IPv4 whitelist set
  ansible.builtin.command:
    argv: [grep, -Eq, 'set[[:space:]]+whitelist_v4', /var/lib/rw-node-firewall/whitelist.nft.download]
  register: whitelist_v4_check
  changed_when: false
  failed_when: false
  when: firewall_whitelist_stat.stat.exists

- name: Detect IPv6 whitelist set
  ansible.builtin.command:
    argv: [grep, -Eq, 'set[[:space:]]+whitelist_v6', /var/lib/rw-node-firewall/whitelist.nft.download]
  register: whitelist_v6_check
  changed_when: false
  failed_when: false
  when: firewall_whitelist_stat.stat.exists

- name: Render managed inet filter chains
  ansible.builtin.template:
    src: rw-node-firewall-rules.nft.j2
    dest: /var/lib/rw-node-firewall/rules.nft
    mode: '0600'

- name: Validate and apply complete managed nftables ruleset
  ansible.builtin.shell: |
    set -euo pipefail
    WORKDIR="$(mktemp -d)"
    trap 'rm -rf "$WORKDIR"' EXIT
    CANDIDATE="$WORKDIR/nftables.conf"

    extract_filter_body() {
      awk '
        /^[[:space:]]*table[[:space:]]+inet[[:space:]]+filter[[:space:]]*\{/ {
          inside=1; depth=1; next
        }
        inside {
          opens=gsub(/\{/, "{")
          closes=gsub(/\}/, "}")
          depth += opens - closes
          if (depth == 0) { exit }
          print
        }
      ' "$1"
    }

    for fragment in \
      /var/lib/rw-node-firewall/blacklist-v4.nft.download \
      /var/lib/rw-node-firewall/blacklist-v6.nft.download; do
      test -s "$fragment"
      grep -Eq '^[[:space:]]*table[[:space:]]+inet[[:space:]]+filter[[:space:]]*\{' "$fragment"
      ! grep -Eq '^[[:space:]]*chain[[:space:]]' "$fragment"
    done
    grep -Eq 'set[[:space:]]+blacklist_v4' /var/lib/rw-node-firewall/blacklist-v4.nft.download
    grep -Eq 'set[[:space:]]+blacklist_v6' /var/lib/rw-node-firewall/blacklist-v6.nft.download

    if [ -f /var/lib/rw-node-firewall/whitelist.nft.download ]; then
      grep -Eq '^[[:space:]]*table[[:space:]]+inet[[:space:]]+filter[[:space:]]*\{' /var/lib/rw-node-firewall/whitelist.nft.download
      ! grep -Eq '^[[:space:]]*chain[[:space:]]' /var/lib/rw-node-firewall/whitelist.nft.download
    fi

    {
      printf '#!/usr/sbin/nft -f\n\nflush ruleset\n\ntable inet filter {\n'
      extract_filter_body /var/lib/rw-node-firewall/blacklist-v4.nft.download
      extract_filter_body /var/lib/rw-node-firewall/blacklist-v6.nft.download
      if [ -f /var/lib/rw-node-firewall/whitelist.nft.download ]; then
        extract_filter_body /var/lib/rw-node-firewall/whitelist.nft.download
      fi
      cat /var/lib/rw-node-firewall/rules.nft
      printf '}\n'
    } > "$CANDIDATE"

    nft -c -f "$CANDIDATE"
    install -D -m 0600 "$CANDIDATE" /etc/nftables.conf.new
    nft -f "$CANDIDATE"
    mv /etc/nftables.conf.new /etc/nftables.conf
    install -m 0600 /var/lib/rw-node-firewall/blacklist-v4.nft.download /var/lib/rw-node-firewall/blacklist-v4.nft
    install -m 0600 /var/lib/rw-node-firewall/blacklist-v6.nft.download /var/lib/rw-node-firewall/blacklist-v6.nft
    echo applied
  args:
    executable: /bin/bash
  register: firewall_apply
  changed_when: true

- name: Enable managed nftables rules at boot
  ansible.builtin.systemd:
    name: nftables.service
    state: started
    enabled: true

- name: Rebuild Docker nftables rules after a full firewall replacement
  ansible.builtin.systemd:
    name: docker.service
    state: restarted
  when: firewall_apply.changed

- name: Verify SSH remains reachable after firewall reconciliation
  ansible.builtin.wait_for_connection:
    timeout: 60
  when: firewall_apply.changed
