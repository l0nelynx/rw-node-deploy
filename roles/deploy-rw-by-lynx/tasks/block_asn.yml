# ── Firewall: nftables (replaces ufw) ───────────────────────────
- name: Install nftables and wget
  package:
    name:
      - nftables
      - wget
    state: present

# ufw конфликтует с прямым управлением nftables
- name: Disable ufw if present
  service:
    name: ufw
    state: stopped
    enabled: false
  ignore_errors: true

# Собственный whitelist — IP из этого списка всегда accept, независимо от ASN blacklist.
- name: Copy whitelist.nft
  copy:
    src: whitelist.nft
    dest: /tmp/whitelist.nft
    mode: '0600'

# Шаг 1: Сбрасываем всё, грузим whitelist, затем блэклисты.
# После flush ruleset и до загрузки наших цепочек — таблица существует (из whitelist.nft/blacklist.nft),
# но ни одного hook не зарегистрировано, поэтому SSH не прерывается.
- name: Flush ruleset and load ASN blacklists
  shell: |
    set -e
    WORKDIR=$(mktemp -d)
    cd "$WORKDIR"

    echo "Downloading nftables sets..."
    wget -q https://raw.githubusercontent.com/C24Be/AS_Network_List/main/blacklists_nftables/blacklist-v4.nft
    wget -q https://raw.githubusercontent.com/C24Be/AS_Network_List/main/blacklists_nftables/blacklist-v6.nft

    nft flush ruleset

    echo "Loading whitelist set into inet filter..."
    nft -f /tmp/whitelist.nft

    echo "Loading blacklist sets into inet filter..."
    nft -f blacklist-v4.nft
    nft -f blacklist-v6.nft

    rm -rf "$WORKDIR"
  args:
    executable: /bin/bash
  register: nft_blacklist_output

# Шаг 2: Пишем правила в файл через Ansible (без heredoc — YAML-safe).
# prerouting priority -150: после conntrack (-200), до Docker DNAT (-100).
# Это означает: blacklisted IP дропается до того как Docker перенаправит пакет в контейнер.
- name: Write nftables filter rules to file
  copy:
    dest: /tmp/nft_filter.nft
    mode: '0600'
    content: |
      table inet filter {
          chain prerouting {
              type filter hook prerouting priority -150; policy accept;
              ip saddr @whitelist_v4 accept
              ip  saddr @blacklist_v4 counter drop
              ip6 saddr @blacklist_v6 counter drop
          }

          chain input {
              type filter hook input priority 0; policy drop;
              ct state established,related accept
              ct state invalid drop
              iif lo accept
              ip saddr 172.22.0.0/16 accept
              tcp dport 22 accept
              tcp dport 2222 accept
              udp sport 2408 accept
              tcp dport 443 accept
              udp dport 443 accept
              udp dport 8443 accept
              tcp dport 8443 accept
              icmp  type echo-request accept
              icmpv6 type { echo-request, nd-neighbor-solicit, nd-neighbor-advert, nd-router-advert, nd-router-solicit } accept
          }

          chain forward {
              type filter hook forward priority 0; policy accept;
          }

          chain output {
              type filter hook output priority 0; policy accept;
          }
      }

# Шаг 3: Загружаем атомарно — все цепочки и правила применяются одним вызовом.
# Нет промежуточного состояния "policy drop без accept-правил" → SSH не рвётся.
- name: Load nftables filter rules atomically
  command: nft -f /tmp/nft_filter.nft

- name: Remove temporary rule files
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /tmp/nft_filter.nft
    - /tmp/whitelist.nft

# Docker использует iptables-nft для NAT. После nft flush ruleset его цепочки пропали —
# перезапускаем Docker чтобы он пересоздал их до старта контейнеров.
- name: Restart Docker to rebuild iptables NAT chains
  service:
    name: docker
    state: restarted

- name: Reset SSH connection after Docker restart (clears stale ControlMaster socket)
  meta: reset_connection

- name: Wait for SSH to be available after Docker restart
  wait_for_connection:
    delay: 15
    timeout: 180

- name: Save ruleset for persistence across reboots
  shell: |
    printf '#!/usr/sbin/nft -f\n\n' > /etc/nftables.conf
    nft list table inet filter >> /etc/nftables.conf
  args:
    executable: /bin/bash

- name: Enable nftables service
  service:
    name: nftables
    state: started
    enabled: true

- name: Show blacklist load result
  debug:
    var: nft_blacklist_output.stdout_lines
