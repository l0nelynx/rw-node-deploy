# ── Firewall: nftables (replaces ufw) ───────────────────────────
- name: Install nftables and wget
  package:
    name:
      - nftables
      - wget
    state: present

# ufw conflicts with direct nftables management on Ubuntu 26.04+
- name: Disable ufw if present
  service:
    name: ufw
    state: stopped
    enabled: false
  ignore_errors: true

- name: Apply ASN blacklists and base firewall rules
  shell: |
    set -e
    WORKDIR=$(mktemp -d)
    cd "$WORKDIR"

    echo "Downloading nftables sets..."
    wget -q https://raw.githubusercontent.com/C24Be/AS_Network_List/main/blacklists_nftables/blacklist.nft
    wget -q https://raw.githubusercontent.com/C24Be/AS_Network_List/main/blacklists_nftables/blacklist-v4.nft
    wget -q https://raw.githubusercontent.com/C24Be/AS_Network_List/main/blacklists_nftables/blacklist-v6.nft

    wget -q https://raw.githubusercontent.com/C24Be/AS_Network_List/main/blacklists_nftables/blacklist-vk.nft
    wget -q https://raw.githubusercontent.com/C24Be/AS_Network_List/main/blacklists_nftables/blacklist-vk-v4.nft
    wget -q https://raw.githubusercontent.com/C24Be/AS_Network_List/main/blacklists_nftables/blacklist-vk-v6.nft

    echo "Flushing existing ruleset..."
    nft flush ruleset

    echo "Loading blacklist sets..."
    nft -f blacklist.nft
    nft -f blacklist-v4.nft
    nft -f blacklist-v6.nft
    nft -f blacklist-vk.nft
    nft -f blacklist-vk-v4.nft
    nft -f blacklist-vk-v6.nft

    echo "Building base firewall..."
    nft add table inet filter
    nft add chain inet filter input  '{ type filter hook input  priority 0; policy drop; }'
    nft add chain inet filter forward '{ type filter hook forward priority 0; policy accept; }'
    nft add chain inet filter output  '{ type filter hook output  priority 0; policy accept; }'

    # Drop blacklisted ASNs before any accept rules
    nft add rule inet filter prerouting ip  saddr @blacklist_v4 counter drop
    nft add rule inet filter prerouting ip6 saddr @blacklist_v6 counter drop

    # Stateful: accept established/related, drop invalid
    nft add rule inet filter prerouting ct state established,related accept
    nft add rule inet filter input ct state invalid drop

    # Loopback
    nft add rule inet filter input iif lo accept

    # SSH (prevent lockout)
    nft add rule inet filter input tcp dport 22 accept

    # Remnanode API (panel → node communication)
    nft add rule inet filter input tcp dport 2222 accept

    # WARP/WireGuard: allow responses from Cloudflare endpoint (port 2408)
    # WireGuard uses a random listening port so we match by source port instead of conntrack
    nft add rule inet filter prerouting udp sport 2408 accept

    # HTTPS — TCP + UDP (QUIC / HTTP3)
    nft add rule inet filter input tcp dport 443 ct state new meter https_limit { ip saddr timeout 1m limit rate over 10/second } drop
    nft add rule inet filter input tcp dport 443 ct state new accept
    nft add rule inet filter input udp dport 443 accept
    nft add rule inet filter input udp dport 8443 accept
    nft add rule inet filter input udp dport 2408 accept

    # ICMP
    nft add rule inet filter input icmp  type echo-request accept
    nft add rule inet filter input icmpv6 type echo-request accept

    rm -rf "$WORKDIR"
  args:
    executable: /bin/bash
  register: nft_output

# Docker uses iptables-nft for NAT (port publishing). After nft flush ruleset,
# its chains are gone — restart Docker so it rebuilds them before containers start.
- name: Restart Docker to rebuild iptables NAT chains
  service:
    name: docker
    state: restarted

- name: Save ruleset for persistence across reboots
  shell: nft list ruleset > /etc/nftables.conf
  args:
    executable: /bin/bash

- name: Enable nftables service
  service:
    name: nftables
    state: started
    enabled: true

- name: Show nftables result
  debug:
    var: nft_output.stdout_lines
