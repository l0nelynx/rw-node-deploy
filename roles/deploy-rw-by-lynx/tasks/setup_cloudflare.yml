---
- name: Assert Cloudflare deployment inputs
  ansible.builtin.assert:
    that:
      - cf_token is defined
      - cf_token | length > 0
      - cf_zone_id is defined
      - cf_zone_id is match('^[A-Za-z0-9]+$')
    fail_msg: cf_token and cf_zone_id are required for DNS reconciliation.
  no_log: true

- name: Build desired Cloudflare DNS name list
  ansible.builtin.set_fact:
    cf_dns_names: "{{ [reality_domain] + (subdomains | map(attribute='sub_full') | list) }}"

- name: Reconcile Cloudflare A records
  ansible.builtin.include_tasks: ensure_cloudflare_record.yml
  loop: "{{ cf_dns_names }}"
  loop_control:
    loop_var: cf_dns_name
