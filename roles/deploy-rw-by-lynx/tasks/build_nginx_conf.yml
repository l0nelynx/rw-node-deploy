---
- name: Ensure nginx configuration directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ target_dir }}"
    - "{{ target_dir }}/conf.d"

- name: Generate default nginx server configuration
  ansible.builtin.template:
    src: default.conf.j2
    dest: "{{ target_dir }}/conf.d/default.conf"
    mode: '0644'
  register: default_nginx_config

- name: Generate nginx stream configuration
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: "{{ target_dir }}/nginx.conf"
    mode: '0644'
  register: stream_nginx_config

- name: Record whether nginx configuration changed
  ansible.builtin.set_fact:
    nginx_config_changed: "{{ default_nginx_config.changed or stream_nginx_config.changed }}"
