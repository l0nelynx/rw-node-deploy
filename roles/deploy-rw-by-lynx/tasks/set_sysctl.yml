---
- name: Check whether BBR is available
  ansible.builtin.command:
    argv: [sysctl, -n, net.ipv4.tcp_available_congestion_control]
  register: available_congestion_controls
  changed_when: false

- name: Require BBR support
  ansible.builtin.assert:
    that: "'bbr' in available_congestion_controls.stdout.split()"
    fail_msg: BBR is not available in the current kernel.

- name: Render rw-node sysctl drop-in
  ansible.builtin.copy:
    dest: /etc/sysctl.d/90-rw-node.conf
    mode: '0644'
    content: |
      net.core.wmem_max = 16777216
      net.core.rmem_max = 16777216
      net.ipv4.tcp_syncookies = 1
      net.core.default_qdisc = fq
      net.ipv4.tcp_congestion_control = bbr
      fs.file-max = 2097152
      fs.nr_open = 2097152
      net.ipv4.tcp_rmem = 4096 87380 16777216
      net.ipv4.tcp_wmem = 4096 65536 16777216
      net.ipv4.tcp_fastopen = 3
      net.core.somaxconn = 65535
      net.core.netdev_max_backlog = 65535
      net.ipv4.tcp_max_syn_backlog = 65535
      net.ipv4.tcp_fin_timeout = 10
      {% if disable_ipv6 | default(false) | bool %}
      net.ipv6.conf.all.disable_ipv6 = 1
      net.ipv6.conf.default.disable_ipv6 = 1
      net.ipv6.conf.lo.disable_ipv6 = 1
      {% endif %}
  notify: Apply rw-node sysctl settings
