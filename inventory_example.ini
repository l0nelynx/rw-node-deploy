[webservers]
# Example host with password authentication, WARP+ key
server1 ansible_host=1.2.3.4 sub_mask=sub1 template=levelup-hub root_pass=your_password_here install_warp=true warp_plus=xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx

# Example host with SSH key, free WARP (no WARP+ key)
server2 ansible_host=5.6.7.8 sub_mask=sub2 force_reinstall=false install_warp=true

# Example host without WARP
server3 ansible_host=9.10.11.12 sub_mask=sub3

[all:vars]
ansible_user=root
main_domain=example.com
sub_count=3

# pp_map: 1 for Proxy Protocol enabled, 0 for disabled. Length should match sub_count
pp_map=[1, 0, 1]

# SSH master key filename (located in project root) for bootstrapping
master_key=id_ed25519

# Remnawave settings
rw_endpoint=https://panel.example.com
rw_token=your_remnawave_api_token_here
rw_config_uuid=your-config-profile-uuid-here
rw_inbounds=["VLESS_TCP_REALITY_NGINX", "TCP_TLS_NGINX", "XHTTP_REALITY_NGINX", "gRPC_REALITY_NGINX"]

# Cloudflare settings for DNS/SSL
cf_token=your_cloudflare_api_token_here
cf_zone_id=your_cloudflare_zone_id_here
